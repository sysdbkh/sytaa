<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корисні копалини України — ігри</title>
<style>
  :root{--ink:#1d2433;--mut:#6b7385;--card:#fff;--bg:#f2f4f8;--ok:#2e9d57;--bad:#d64545}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  .wrap{max-width:900px;margin:0 auto;padding:10px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 2px 8px}
  h1{font-size:16px;margin:0;line-height:1.25}
  h1 small{display:block;font-weight:400;font-size:12.5px;color:var(--mut)}
  .stat{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
  .stat b{color:var(--ink)}
  .bar{height:6px;background:#dfe3ec;border-radius:4px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
  .mapbox{position:relative;border-radius:16px;overflow:hidden;border:1px solid #b9c7d8;box-shadow:0 4px 14px rgba(40,60,90,.18),inset 0 0 0 3px rgba(255,255,255,.5);background:#e9e5d8}
  svg.map{display:block;width:100%;aspect-ratio:760/510;height:auto;touch-action:manipulation;cursor:crosshair}
  .zoom{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 70px)}
  .zoom button{font-size:11px;padding:4px 9px;background:rgba(255,255,255,.88);border-color:rgba(120,130,150,.4);backdrop-filter:blur(3px)}
  .zoom button.on{background:var(--ink);color:#fff}
  .north{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;color:#35506b;background:rgba(255,255,255,.8);border-radius:999px;padding:3px 8px}
  .toast{position:fixed;left:50%;top:10px;transform:translate(-50%,-10px);max-width:min(92vw,560px);padding:9px 12px;border-radius:10px;font-size:13px;background:rgba(29,36,51,.94);color:#fff;opacity:0;transition:.2s;pointer-events:none;text-align:center;z-index:30}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.good{background:rgba(46,157,87,.96)}
  .toast.err{background:rgba(214,69,69,.96)}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  button{font:inherit;font-size:13px;border:1px solid #cbd2e1;background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tray{margin-top:8px}
  .tray h2{font-size:13px;margin:0 2px 6px;color:var(--mut);font-weight:600}
  #chips{margin:0}
  .chip{padding:8px 12px;font-size:14px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
  .chip small{color:var(--mut);font-size:11.5px}
  .chip.sel{background:#ffd54a;border-color:#e0b400;font-weight:600}
  .chip.sel small{color:#6b5400}
  .chip.shake,.col.shake{animation:sh .35s}
  .ghost{position:fixed;z-index:25;pointer-events:none;opacity:.96;transform:translate(-50%,-135%);box-shadow:0 8px 20px rgba(0,0,0,.28);cursor:grabbing}
  /* таблиця платформ */
  #chips.tbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;background:var(--card);border:1px solid #cfd6e4;border-radius:12px;overflow:hidden}
  #chips.tbl .chip{border:0;border-bottom:1px solid #e5e9f1;border-radius:0;background:transparent;padding:10px 12px;width:100%;font-size:14px}
  #chips.tbl .chip::before{content:"⠿";color:#9aa3b8;font-size:16px}
  #chips.tbl .chip.sel{background:#fff3c4}
  @keyframes sh{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .pulse{animation:pl .5s ease 4}
  @keyframes pl{50%{opacity:1}}
  .reg{transition:opacity .25s}
  .city circle{fill:#fff;stroke:#5a6275;stroke-width:1.2}
  .city .cap circle{fill:#1d2433;stroke:#fff}
  .city text{font-size:9px;fill:#4a5266;font-weight:600;paint-order:stroke;stroke:rgba(255,252,240,.95);stroke-width:2.6px;stroke-linejoin:round}
  .nb{font-size:11px;font-style:italic;fill:#9a9582;letter-spacing:.06em;text-transform:uppercase}
  .sea{font-size:11px;font-style:italic;fill:#4b86ad;letter-spacing:.1em}
  .ping{fill:none;stroke:var(--bad);stroke-width:2;animation:png .7s forwards}
  .ping.g{stroke:var(--ok)}
  @keyframes png{from{r:4;opacity:1}to{r:26;opacity:0}}
  .pop{animation:pop .38s cubic-bezier(.2,1.6,.4,1);transform-origin:0 0}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .lab{font-size:10px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;fill:#1d2433}
  .alab{font-size:10px;font-weight:700;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:3px;stroke-linejoin:round;fill:#2b2340;text-anchor:middle}
  .rlab{font-size:11px;font-weight:700;fill:#4b3b6e;opacity:.9;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:2.5px;text-anchor:middle}
  .info{display:none;margin-top:8px;background:var(--card);border:1px solid #cfd6e4;border-left:5px solid var(--ok);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
  .info b{display:block;margin-bottom:2px}
  .end{display:none;margin-top:10px;background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid #cfd6e4}
  .end.show{display:block}
  .end h3{margin:0 0 4px;font-size:18px}
  .hint{font-size:12px;color:var(--mut);margin:4px 2px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .col{background:var(--card);border:2px dashed #b9c1d3;border-radius:14px;padding:10px;min-height:150px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
  .col.over{background:#fffbe6;border-color:#e0b400}
  .col h4{margin:0 0 2px;font-size:15px}
  .col p{margin:0 0 8px;font-size:11.5px;color:var(--mut)}
  .tag{display:inline-block;background:#e7f6ec;border:1px solid #b6e0c5;color:#1d5a35;border-radius:8px;padding:3px 7px;font-size:12.5px;margin:0 4px 4px 0}
  .funbox{background:var(--card);border:1px solid #cfd6e4;border-radius:14px;padding:8px;overflow:auto;max-height:78vh}
  .funbox img{display:block;width:100%;border-radius:10px;cursor:zoom-in}
  .funbox img.big{width:220%;max-width:none;cursor:zoom-out}
  .funmiss{display:none;padding:16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <header>
    <h1 id="title"></h1>
    <div class="stat">Поставлено: <b id="done">0</b>/<b id="total">0</b><br>Помилок: <b id="err">0</b></div>
  </header>
  <div class="bar"><i id="bar"></i></div>

  <div id="mapSec">
    <div class="mapbox">
      <svg class="map" id="svg" viewBox="0 0 760 510" xmlns="http://www.w3.org/2000/svg" aria-label="Карта України"></svg>
      <div class="zoom" id="focus">
        <button data-v="all" class="on">Уся країна</button>
        <button data-v="west">Захід</button>
        <button data-v="center">Центр</button>
        <button data-v="east">Схід</button>
        <button data-v="south">Південь</button>
      </div>
      <div class="north">⬆ Пн</div>
    </div>
  </div>

  <div id="sortSec" style="display:none">
    <div class="row" id="levels"></div>
    <div class="cols" id="cols"></div>
  </div>

  <div id="funSec" style="display:none">
    <div class="funbox">
      <img id="funImg" src="mnemo.jpg" alt="Цікаве — мнемоніка">
      <div class="funmiss" id="funMiss">Не вдалося завантажити картинку <b>mnemo.jpg</b>.<br>Поклади файл <b>mnemo.jpg</b> в ту саму папку, де лежить цей HTML-файл.</div>
    </div>
    <p class="hint">Торкнись картинки, щоб збільшити; ще раз — щоб повернути.</p>
  </div>

  <div class="tray">
    <h2 id="trayTitle"></h2>
    <div class="row" id="chips"></div>
  </div>

  <div class="info" id="info"></div>

  <div class="row" id="ctrl">
    <button id="mode"></button>
    <button id="hintBtn">💡 Підказка</button>
    <button id="reset">↻ Спочатку</button>
  </div>

  <div class="end" id="end">
    <h3 id="endTitle"></h3>
    <div id="endText" class="hint"></div>
    <div class="row" style="justify-content:center"><button id="again" class="on">Грати ще раз</button></div>
  </div>
  <p class="hint" id="foot"></p>
</div>
<div class="toast" id="toast"></div>

function smooth(points,closed,t){
  t=t||0.16;const P=points.map(p=>[X(p[0]),Y(p[1])]),n=P.length;
  const g=i=>closed?P[(i+n)%n]:P[Math.max(0,Math.min(n-1,i))];
  let d='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
  for(let i=0;i<(closed?n:n-1);i++){
    const a=g(i-1),b=g(i),c=g(i+1),e=g(i+2);
    d+=`C${(b[0]+(c[0]-a[0])*t).toFixed(1)},${(b[1]+(c[1]-a[1])*t).toFixed(1)} ${(c[0]-(e[0]-b[0])*t).toFixed(1)},${(c[1]-(e[1]-b[1])*t).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`;
  }
  return d+(closed?'Z':'');
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pip(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
function ping(x,y,good){const c=el('circle',{cx:x,cy:y,r:4,class:'ping'+(good?' g':'')},fxG);setTimeout(()=>c.remove(),800);}

/* ================= масштаб / вигляд ================= */
function applyScale(){
  const s=view[2]/760;
  svg.querySelectorAll('g.sc').forEach(g=>g.setAttribute('transform',`translate(${g.dataset.x},${g.dataset.y}) scale(${Math.max(s,+g.dataset.min||0)})`));
}
function setView(v){
  const from=view.slice(),t0=performance.now();cancelAnimationFrame(anim);
  const step=t=>{const p=Math.min(1,(t-t0)/380),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    view=from.map((a,i)=>a+(v[i]-a)*e);svg.setAttribute('viewBox',view.join(' '));applyScale();
    if(p<1)anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}
document.querySelectorAll('#focus button').forEach(b=>b.onclick=()=>{

function openGame(id){
  G=GAMES.find(g=>g.id===id);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  const isFun=G.kind==='fun';
  ['.tray','#ctrl','.bar','.stat'].forEach(q=>document.querySelector(q).style.display=isFun?'none':'');
  $('funSec').style.display=isFun?'':'none';
  if(isFun){
    $('title').innerHTML=G.title+'<small>'+G.sub+'</small>';
    $('mapSec').style.display='none';$('sortSec').style.display='none';
    $('info').style.display='none';$('end').classList.remove('show');$('foot').textContent='';
    return;
  }
  const isSort=G.kind==='sort';
  $('mapSec').style.display=isSort?'none':'';
  $('sortSec').style.display=isSort?'':'none';
  $('mode').style.display=isSort?'none':'';
  $('hintBtn').style.display=isSort?'none':'';
  $('title').innerHTML=G.title+'<small>'+G.sub+'</small>';
  $('trayTitle').textContent=G.tray;
  $('chips').className='row'+(G.kind==='area'?' tbl':'');

  hints=true;
  if(!isSort)drawLayers();
  newGame();
}

function drawLayers(){
  areaG.innerHTML='';rlabG.innerHTML='';regEls={};rlabEls={};areaEls=[];
  cityG.style.display='';
  if(G.id==='oil'){
    for(const k in REG){
      const g=el('g',{class:'reg'},areaG);
      el('polygon',{points:pts(REG[k].poly),fill:REG[k].col,'fill-opacity':.3,stroke:REG[k].col,'stroke-width':1.3,'stroke-dasharray':'5 3','stroke-linejoin':'round'},g);
      regEls[k]=g;
      const w=el('g',{class:'sc'},rlabG);w.dataset.x=X(REG[k].lab[0]);w.dataset.y=Y(REG[k].lab[1]);w.dataset.min=.6;
      const t=el('text',{class:'rlab'},w);t.textContent=REG[k].name.replace(' регіон','');rlabEls[k]=w;
    }
  }
  if(G.kind==='area'){
    G.items.forEach((it,i)=>{
      areaEls[i]=it.polys.map(p=>el('polygon',{points:pts(p),fill:'rgba(120,130,150,.10)',stroke:'#7a7f8f','stroke-width':1.2,'stroke-dasharray':'4 3','stroke-linejoin':'round'},areaG));
    });
  }
  updateHints();applyScale();
}
function updateHints(){
  if(!G||G.kind==='sort')return;
  $('mode').textContent=G.modeName+': '+(hints?'ввімк.':'вимк. (складно)');
  $('mode').classList.toggle('on',!hints);
  if(G.id==='oil'){for(const k in regEls)regEls[k].style.opacity=hints?1:0;for(const k in rlabEls)rlabEls[k].style.display=hints?'':'none';}
  else if(G.kind==='area'){G.items.forEach((it,i)=>{if(!placed[i])areaEls[i].forEach(p=>p.style.display=hints?'':'none');});}
  else cityG.style.display=hints?'':'none';
}

/* ================= нова гра ================= */
function newGame(){
  placed={};errs=0;markG.innerHTML='';fxG.innerHTML='';$('end').classList.remove('show');$('info').style.display='none';
  if(G.kind==='area'){G.items.forEach((it,i)=>areaEls[i].forEach(p=>{p.setAttribute('fill','rgba(120,130,150,.10)');p.setAttribute('stroke','#7a7f8f');p.setAttribute('stroke-dasharray','4 3');p.setAttribute('stroke-width',1.2);}));}
  if(G.kind==='sort')buildSortUI();
  const n=total();order=shuffle([...Array(n).keys()]);sel=order[0];
  updateHints();buildChips();stats();applyScale();
}
$('reset').onclick=()=>newGame();$('again').onclick=()=>newGame();
$('mode').onclick=()=>{hints=!hints;updateHints();};

/* ================= фішки + перетягування ================= */
function buildChips(){
  const box=$('chips');box.innerHTML='';
  order.forEach(i=>{
    if(placed[i])return;
    const b=document.createElement('button');b.className='chip'+(sel===i?' sel':'');b.dataset.i=i;
    if(G.kind==='sort')b.textContent=SORTS[sortIdx].items[i][0];
    else if(G.kind==='area')b.textContent=G.items[i].n;
    else{const d=G.items[i];b.innerHTML=(G.id==='oil'?'':miniSym(d.sym))+'<span>'+d.n+(d.res?'<br><small>'+d.res+'</small>':'')+'</span>';}
    b.addEventListener('pointerdown',e=>chipDown(e,i,b));
    box.appendChild(b);
  });
}
function markSel(){document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('sel',+c.dataset.i===sel));}
function shakeSel(){const c=document.querySelector('.chip.sel');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}}
function nextSel(){const left=order.filter(i=>!placed[i]);sel=left.length?left[0]:null;return left.length;}

function chipDown(e,i,b){
  if(e.pointerType==='mouse'&&e.button!==0)return;
  sel=i;markSel();
  drag={i,sx:e.clientX,sy:e.clientY,on:false,ghost:null,b};
  window.addEventListener('pointermove',dragMove,{passive:false});
  window.addEventListener('pointerup',dragUp);
  window.addEventListener('pointercancel',dragUp);
}
function dragMove(e){
  if(!drag)return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8)return;
    drag.on=true;
    const g=drag.b.cloneNode(true);g.classList.add('ghost','sel');g.style.width=drag.b.offsetWidth+'px';
    document.body.appendChild(g);drag.ghost=g;drag.b.style.opacity=.35;
  }
  drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
  if(G.kind==='sort'){
    document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
    const t=document.elementFromPoint(e.clientX,e.clientY);const c=t&&t.closest('.col');if(c)c.classList.add('over');
  }else{
    const r=svg.getBoundingClientRect();
    const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(inside){
      const p=toSvg(e.clientX,e.clientY);
      if(!dragPt)dragPt=el('circle',{r:7,fill:'rgba(255,213,74,.35)',stroke:'#e0b400','stroke-width':2},fxG);
      dragPt.setAttribute('cx',p.x);dragPt.setAttribute('cy',p.y);
    }else if(dragPt){dragPt.remove();dragPt=null;}
  }
  e.preventDefault();
}
function dragUp(e){
  window.removeEventListener('pointermove',dragMove);
  window.removeEventListener('pointerup',dragUp);
  window.removeEventListener('pointercancel',dragUp);
  const d=drag;drag=null;if(!d)return;
  if(dragPt){dragPt.remove();dragPt=null;}
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  if(!d.on)return;
  d.ghost.remove();d.b.style.opacity='';
  if(e.type==='pointercancel')return;
  if(G.kind==='sort'){
    const t=document.elementFromPoint(e.clientX,e.clientY);const c=t&&t.closest('.col');
    if(c)dropToCol(c.dataset.id,c);
  }else{
    const r=svg.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)placeAt(e.clientX,e.clientY);
  }
}

/* ================= розміщення на карті ================= */
svg.addEventListener('click',e=>placeAt(e.clientX,e.clientY));
function placeAt(cx,cy){
  if(!G||G.kind==='sort')return;
  if(sel===null){toast('Спершу обери об’єкт внизу');return;}
  const p=toSvg(cx,cy);
  if(G.kind==='point')clickPoint(p);else clickArea(p);
}

function clickPoint(p){
  const d=G.items[sel];
  const dist=q=>Math.hypot(p.x-X(q.lon),p.y-Y(q.lat));
  const dc=dist(d);
  let ok=dc<=42;
  if(ok)for(let i=0;i<G.items.length;i++){if(i!==sel&&dist(G.items[i])<dc){ok=false;break;}}
  if(ok){
    placed[sel]=true;
    const g=el('g',{class:'m sc'},markG);g.dataset.x=X(d.lon);g.dataset.y=Y(d.lat);g.dataset.min=0;
    const halo=G.id==='oil'?'':'<circle r="9" fill="#fff" fill-opacity=".93" stroke="#cbbf9f" stroke-width=".8"/>';
    g.innerHTML=`<g class="pop">${halo}${symSVG(d.sym,d.col)}<text x="11" y="3.5" class="lab">${d.n}</text></g>`;
    ping(X(d.lon),Y(d.lat),true);
    toast('✔ '+d.n+(d.res?' — '+d.res:'')+' ('+d.where+')','good');
    const left=nextSel();applyScale();buildChips();stats();
    if(!left)finish();
  }else{
    errs++;stats();ping(p.x,p.y,false);shakeSel();
    let msg='Не тут. Спробуй ще!';
    if(hints){
      if(G.id==='oil'){
        const lon=p.x/K+21.5,lat=52.7-p.y/S;
        let inR=null;for(const k in REG)if(pip(lon,lat,REG[k].poly))inR=k;
        if(inR&&inR!==d.r)msg='Це '+REG[inR].name+', а «'+d.n+'» — в іншому регіоні.';
        else if(inR)msg='Регіон правильний, але місце ні — придивись до карти.';
        else msg='Тут немає нафтогазоносного регіону.';
      }else msg=dc<110?'Близько, але не те місце.':'Далеко від потрібного місця.';
    }
    toast(msg,'err');
  }
}

function clickArea(p){
  const lon=p.x/K+21.5,lat=52.7-p.y/S;
  let hit=-1;
  for(let i=0;i<G.items.length&&hit<0;i++)if(G.items[i].polys.some(poly=>pip(lon,lat,poly)))hit=i;
  if(hit===sel){
    const it=G.items[sel];placed[sel]=true;
    areaEls[sel].forEach(pl=>{pl.style.display='';pl.setAttribute('fill',it.col);pl.setAttribute('fill-opacity',.6);pl.setAttribute('stroke','#4a4a4a');pl.setAttribute('stroke-dasharray','');pl.setAttribute('stroke-width',1.4);});
    const c=it.polys[0].reduce((a,q)=>[a[0]+q[0]/it.polys[0].length,a[1]+q[1]/it.polys[0].length],[0,0]);
    const g=el('g',{class:'m sc'},markG);g.dataset.x=X(c[0]);g.dataset.y=Y(c[1]);g.dataset.min=0;
    const words=it.n.split(' ');const half=Math.ceil(words.length/2);
    const lines=words.length>2?[words.slice(0,half).join(' '),words.slice(half).join(' ')]:[it.n];
    const inner=el('g',{class:'pop'},g);
    lines.forEach((ln,k)=>{const t=el('text',{class:'alab',y:k*11-(lines.length-1)*5},inner);t.textContent=ln;});
    ping(X(c[0]),Y(c[1]),true);
    const info=$('info');info.style.display='block';info.style.borderLeftColor=it.col;info.innerHTML='<b>'+it.n+'</b>'+it.info;
    toast('✔ '+it.n,'good');
    const left=nextSel();applyScale();buildChips();stats();
    if(!left)finish();
  }else{
    errs++;stats();ping(p.x,p.y,false);shakeSel();
    let msg='Не тут. Спробуй ще!';
    if(hints)msg=hit>=0?'Це «'+G.items[hit].n+'», а шукаємо «'+G.items[sel].n+'».':'Тут немає цієї структури.';
    toast(msg,'err');
  }
}

/* ================= підказка ================= */
$('hintBtn').onclick=()=>{
  if(!G||sel===null||G.kind==='sort')return;
  const it=G.items[sel];
  if(G.id==='oil'){
    const g=regEls[it.r];g.style.opacity=1;g.classList.add('pulse');rlabEls[it.r].style.display='';
    setTimeout(()=>{g.classList.remove('pulse');if(!hints){g.style.opacity=0;rlabEls[it.r].style.display='none';}},2600);
  }else if(G.kind==='point'){
    const c=el('circle',{cx:X(it.lon),cy:Y(it.lat),r:62,fill:'rgba(255,213,74,.25)',stroke:'#e0b400','stroke-width':2,'stroke-dasharray':'6 4'},fxG);
    setTimeout(()=>c.remove(),2800);
  }else{
    const si=sel;
    areaEls[si].forEach(pl=>{pl.style.display='';pl.classList.add('pulse');pl.setAttribute('stroke','#e0b400');pl.setAttribute('stroke-width',3);});
    setTimeout(()=>areaEls[si].forEach(pl=>{pl.classList.remove('pulse');if(!placed[si]){pl.setAttribute('stroke','#7a7f8f');pl.setAttribute('stroke-width',1.2);if(!hints)pl.style.display='none';}}),2800);
  }
  toast('«'+it.n+'»: '+it.where);
};

/* ================= таблиця ================= */
function buildSortUI(){
  const lv=$('levels');lv.innerHTML='';
  SORTS.forEach((s,i)=>{const b=document.createElement('button');b.textContent='Рівень '+(i+1)+': '+s.name;b.className=i===sortIdx?'on':'';b.onclick=()=>{sortIdx=i;newGame();};lv.appendChild(b);});
  const cols=$('cols');cols.innerHTML='';
  SORTS[sortIdx].cols.forEach(c=>{
    const d=document.createElement('div');d.className='col';d.dataset.id=c.id;
    d.innerHTML='<h4>'+c.n+'</h4><p>'+(c.s||'&nbsp;')+'</p><div class="tags"></div>';
    d.onclick=()=>dropToCol(c.id,d);
    cols.appendChild(d);
  });
}
function dropToCol(cid,d){
  if(sel===null){toast('Спершу обери копалину внизу');return;}
  const it=SORTS[sortIdx].items[sel];
  if(it[1]===cid){
    placed[sel]=true;
    const t=document.createElement('span');t.className='tag';t.textContent=it[0];d.querySelector('.tags').appendChild(t);
    toast('✔ '+it[0],'good');
    const left=nextSel();buildChips();stats();
    if(!left)finish();
  }else{
    errs++;stats();shakeSel();d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    toast('Не сюди. «'+it[0]+'» — не «'+SORTS[sortIdx].cols.find(c=>c.id===cid).n.toLowerCase()+'».','err');
  }
}

/* ================= фінал ================= */
function finish(){
  const n=total();
  let title=errs===0?'Без жодної помилки! 🏆':(errs>8?'Усе поставлено 👍':'Чудово! 🎉');
  let txt='Усе на місці: '+n+'. Помилок: '+errs+'.';
  if(errs>8)txt+=' Спробуй ще раз — а потім вимкни підказки.';
  if(G.kind==='area')txt+=' З Українським щитом пов’язана більшість родовищ рудних і нерудних корисних копалин; у платформному чохлі зосереджені осадові породи; до западин і прогинів приурочені родовища вугілля, нафти, газу, солей.';
  $('endTitle').textContent=title;$('endText').textContent=txt;$('end').classList.add('show');
  $('end').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ================= вкладка «Цікаве» ================= */
(function(){
  const img=$('funImg');
  img.addEventListener('click',()=>img.classList.toggle('big'));
  img.addEventListener('error',()=>{img.style.display='none';$('funMiss').style.display='block';});
})();

openGame('oil');
</script>
