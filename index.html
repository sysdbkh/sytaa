<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Географія України – НМТ: тренажер за конспектом</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--mut:#6b7280;--acc:#1f5fbf;--ok:#1f9d55;--bad:#d64545;--warn:#e8a317;--line:#d9d4c7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{padding:10px 12px 0}
h1{font-size:17px;margin:0 0 2px}
.sub{font-size:12px;color:var(--mut)}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:20;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 11px;font-size:13px;white-space:nowrap}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab small{opacity:.8;margin-left:4px}
.tab.done small{color:#8df0b0}
.tab:not(.on).done small{color:var(--ok)}
main{padding:0 12px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:10px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.hint{font-size:12.5px;color:var(--mut)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.bar .grow{flex:1}
.pill{background:#eef2fa;border-radius:10px;padding:2px 8px}
.pill.r{background:#fdeaea;color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
#mapbox{overflow:auto;max-height:70vh;border-radius:8px;border:1px solid var(--line);background:#cfe4f3;touch-action:pan-x pan-y}
#mapbox svg{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.chip{background:#fff;border:2px solid var(--acc);color:var(--acc);border-radius:10px;padding:6px 9px;font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{background:var(--acc);color:#fff}
.ghost{position:fixed;z-index:99;pointer-events:none;background:var(--acc);color:#fff;border-radius:10px;padding:6px 9px;font-size:13px;opacity:.92;transform:translate(-50%,-130%);box-shadow:0 3px 10px rgba(0,0,0,.3)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;background:#222;color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
.slot{cursor:pointer}
.slot .c{fill:rgba(255,235,59,.55);stroke:#1d2433;stroke-width:1.6;vector-effect:non-scaling-stroke}
.slot.ap .c{stroke-dasharray:4 3}
.slot.ok .c{fill:rgba(31,157,85,.85);stroke:#0d5c30}
.slot.wrong .c{fill:rgba(214,69,69,.9)}
.slot .t{font-size:11px;font-weight:700;fill:#1d2433;text-anchor:middle;pointer-events:none}
.armed .slot:not(.ok) .c{animation:pul 1s infinite}
.slot.near .c{fill:rgba(255,120,0,.85)}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.35}}
.zh{fill:none;stroke:#fff;stroke-width:6;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.zone{fill:rgba(255,255,255,.28);stroke:#0a2fd0;stroke-width:2.6;stroke-dasharray:8 5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.armed .zone:not(.ok){animation:pul 1s infinite}
.zone.ok{fill:rgba(31,157,85,.4);stroke:#0d5c30;stroke-dasharray:none}
.zone.near{fill:rgba(255,200,0,.6)}
.zone.wrong{fill:rgba(214,69,69,.5)}
.lab{font-weight:700;fill:#0b3d1d;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.info{font-size:13.5px}
.info b{color:var(--acc)}
.src{font-size:12px;color:var(--mut);margin-top:3px}
.cols{display:grid;gap:8px;grid-template-columns:repeat(var(--n),1fr)}
.col{border:2px dashed var(--acc);border-radius:10px;min-height:120px;padding:6px;background:#f7faff}
.col.near{background:#fff3cc}
.col h4{margin:0 0 6px;font-size:13px;text-align:center}
.col .chip{display:block;margin:4px 0;border-color:var(--ok);color:var(--ok);background:#effaf3;font-size:12px}
.lvl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lvl .btn.on{background:var(--acc);color:#fff}
#final{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:none;align-items:flex-end;justify-content:center}
#final.on{display:flex}
#final .sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:14px}
#final h2{margin:0 0 4px;font-size:18px}
.big{font-size:34px;font-weight:800;color:var(--acc)}
.mis{border-left:4px solid var(--bad);background:#fdf3f3;padding:6px 8px;margin:6px 0;border-radius:4px;font-size:13px}
.fun img{width:100%;border-radius:8px}
.fun img.big{position:fixed;inset:0;margin:auto;max-height:100vh;object-fit:contain;background:#000;z-index:130;width:100%}
</style>
</head>

function st(id){if(!S[id])S[id]={placed:{},wrong:0,miss:{},attempt:1,best:null,hist:[],only:null,done:false};return S[id]}
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function toast(t,k){const e=$('#toast');e.textContent=t;e.className='show '+(k||'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2400)}

const MAPS={};D.maps.forEach(m=>MAPS[m.id]=m);

function gameOf(id){return id==='sort'?D.sorts[sortLvl]:MAPS[id]}
function sid(id){return id==='sort'?D.sorts[sortLvl].id:id}
function items(g){const s=st(g.id);return s.only?g.items.filter(i=>s.only.includes(i.id)):g.items}
function prog(g){const s=st(g.id),it=items(g);const n=it.filter(i=>s.placed[i.id]!==undefined).length;return[n,it.length]}

function renderTabs(){
  const t=$('#tabs');t.innerHTML='';
  const list=D.maps.map(m=>[m.id,m.tab,[m]]).concat([['sort','Таблиця',D.sorts]]).concat([['fun','✨ Цікаве',[]]]);
  list.forEach(([id,name,gs])=>{
    let n=0,tot=0,dn=0;gs.forEach(g=>{const p=prog(g);n+=p[0];tot+=p[1];if(st(g.id).done)dn++});
    const b=el('button','tab'+(cur===id?' on':'')+(gs.length&&dn===gs.length?' done':''),name+(gs.length?'<small>'+(dn===gs.length?'★':n+'/'+tot)+'</small>':''));
    b.onclick=()=>{cur=id;selId=null;try{localStorage.setItem(KEY+'_tab',cur)}catch(e){}render()};
    t.appendChild(b);
  });
  const on=t.querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}

function render(){
  renderTabs();
  const m=$('#main');m.innerHTML='';
  if(cur==='fun'){renderFun(m);return}
  const g=gameOf(cur);
  if(cur==='sort')renderSort(m,g);else renderMap(m,g);
}

/* ---------- common UI bits ---------- */
function statusBar(g){
  const s=st(g.id),[n,t]=prog(g);
  const b=el('div','card bar');
  b.innerHTML='<span class="pill">✓ '+n+'/'+t+'</span><span class="pill r">помилок: '+s.wrong+'</span><span class="pill">спроба №'+s.attempt+'</span>'+(s.best!=null?'<span class="pill">🏆 рекорд: '+s.best+' помилок</span>':'')+'<span class="grow"></span>';
  if(s.done){const r=el('button','btn p','Результат');r.onclick=()=>showFinal(g);b.appendChild(r)}
  const rs=el('button','btn','↺ Заново');let armed=false;rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Точно скинути?';rs.style.background='#fdeaea';setTimeout(()=>{armed=false;rs.textContent='↺ Заново';rs.style.background=''},3000);return}resetGame(g,true);selId=null;render();toast('Прогрес гри скинуто')};b.appendChild(rs);
  return b;
}
function resetGame(g,full){
  const s=st(g.id);
  s.placed={};s.wrong=0;s.miss={};s.done=false;
  if(full){s.only=null;s.attempt=1}
  save();
}
function src(g){return '📖 Конспект, '+g.page}  
/* ---------- map games ---------- */
function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a/2)}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function dSeg(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)}
function dPoly(x,y,p){if(inPoly(x,y,p))return 0;let m=1e9;for(let i=0;i<p.length;i++)m=Math.min(m,dSeg(x,y,p[i],p[(i+1)%p.length]));return m}
function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1]});return[x/p.length,y/p.length]}

function renderMap(m,g){
  const s=st(g.id),isArea=g.type==='area';
  m.appendChild(statusBar(g));
  const hc=el('div','card');
  hc.innerHTML='<b>'+g.title+'</b><div class="hint">'+g.hint+'</div>';
  m.appendChild(hc);
  const zb=el('div','bar');
  zb.style.margin='0 0 6px';
  zb.innerHTML='<span class="hint">Масштаб:</span>';
  [['−',()=>zoom=Math.max(1,zoom-.5)],['+',()=>zoom=Math.min(4,zoom+.5)]].forEach(([t,f])=>{const b=el('button','btn',t);b.onclick=()=>{f();drawSvg();};zb.appendChild(b)});
  const mc=el('div','card');mc.style.padding='6px';
  mc.appendChild(zb);
  const box=el('div');box.id='mapbox';mc.appendChild(box);
  m.appendChild(mc);
  const tray=el('div','card');tray.id='tray';m.appendChild(tray);
  const info=el('div','card info');info.id='info';info.style.display='none';m.appendChild(info);
  drawSvg();drawTray();
}

function svgScale(){const sv=$('#mapbox svg');return sv?sv.getBoundingClientRect().width/sv.viewBox.baseVal.width:1}

function drawSvg(){
  const g=gameOf(cur),s=st(g.id),box=$('#mapbox');if(!box)return;
  const sl=box.scrollLeft,stp=box.scrollTop;
  box.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  const sv=document.createElementNS(ns,'svg');
  sv.setAttribute('viewBox','0 0 '+g.W+' '+g.H);
  const maxH=window.innerHeight*0.68;
  const baseW=Math.min(box.clientWidth,maxH*g.W/g.H);
  sv.style.width=(zoom*baseW)+'px';
  sv.style.margin='0 auto';
  sv.id='svg';
  const im=document.createElementNS(ns,'image');
  im.setAttribute('href',g.img);im.setAttribute('width',g.W);im.setAttribute('height',g.H);
  sv.appendChild(im);
  const gg=document.createElementNS(ns,'g');gg.id='layer';sv.appendChild(gg);
  box.appendChild(sv);
  box.scrollLeft=sl;box.scrollTop=stp;
  box.classList.toggle('armed',!!selId||!!drag);
  const sc=baseW*zoom/g.W; // px per map unit
  const R=Math.max(9,13)/sc;
  const fs=11/sc;
  if(g.type==='area'){
    g.items.forEach(it=>{
      const ok=s.placed[it.id]!==undefined;
      it.zones.forEach((z,zi)=>{
        const hh=document.createElementNS(ns,'polygon');hh.setAttribute('points',z.map(q=>q.join(',')).join(' '));hh.setAttribute('class','zh');gg.appendChild(hh);
        const p=document.createElementNS(ns,'polygon');
        p.setAttribute('points',z.map(q=>q.join(',')).join(' '));
        p.setAttribute('class','zone'+(ok?' ok':''));p.dataset.id=it.id;
        p.style.pointerEvents='all';
        p.addEventListener('pointerup',e=>{if(drag)return;e.preventDefault();tapAt(e.clientX,e.clientY)});
        gg.appendChild(p);
      });
      if(ok){
        let big=it.zones.reduce((a,b)=>polyArea(a)>polyArea(b)?a:b);
        const c=centroid(big);
        const t=document.createElementNS(ns,'text');
        t.setAttribute('class','lab');t.setAttribute('x',c[0]);t.setAttribute('y',c[1]);t.setAttribute('font-size',fs);
        t.setAttribute('stroke-width',3/sc);
        t.textContent=it.short;gg.appendChild(t);
      }
    });
  }else{
    g.items.forEach(it=>{
      const ok=s.placed[it.id]!==undefined;
      const a=document.createElementNS(ns,'g');a.setAttribute('class','slot'+(ok?' ok':'')+(it.approx?' ap':''));a.dataset.id=it.id;
      const c=document.createElementNS(ns,'circle');c.setAttribute('class','c');c.setAttribute('cx',it.x);c.setAttribute('cy',it.y);c.setAttribute('r',R);
      a.appendChild(c);
      if(!ok){const t=document.createElementNS(ns,'text');t.setAttribute('class','t');t.setAttribute('x',it.x);t.setAttribute('y',it.y+4/sc);t.setAttribute('font-size',fs);t.textContent=it.approx?'≈':'?';a.appendChild(t)}
      else{
        const t=document.createElementNS(ns,'text');t.setAttribute('class','lab');t.setAttribute('x',it.x);t.setAttribute('y',it.y-R-3/sc);t.setAttribute('font-size',fs);t.setAttribute('stroke-width',3/sc);t.textContent=it.short;a.appendChild(t);
      }
      a.addEventListener('pointerup',e=>{if(drag)return;e.preventDefault();e.stopPropagation();tapSlot(it.id)});
      gg.appendChild(a);
    });
  }
}
function svgPt(cx,cy){const sv=$('#svg');if(!sv)return null;const r=sv.getBoundingClientRect();if(cx<r.left||cx>r.right||cy<r.top||cy>r.bottom)return null;const vb=sv.viewBox.baseVal;return[(cx-r.left)/r.width*vb.width,(cy-r.top)/r.height*vb.height]}

function hitArea(g,x,y){
  const sc=svgScale();const tol=6/Math.max(sc,.3);
  const hits=[];
  g.items.forEach(it=>it.zones.forEach(z=>{const d=dPoly(x,y,z);if(d<=tol)hits.push([it,polyArea(z),d])}));
  hits.sort((a,b)=>(a[2]>0)-(b[2]>0)||a[1]-b[1]);
  return hits;
}
function nearestSlot(g,x,y){
  const sc=svgScale(),lim=22/Math.max(sc,.2);let b=null,bd=1e9;
  g.items.forEach(it=>{const d=Math.hypot(it.x-x,it.y-y);if(d<bd){bd=d;b=it}});
  return bd<=lim?b:null;
}
function placeOn(itemId,target){ // target = item object representing what was hit (or null)
  const g=gameOf(cur),s=st(g.id),it=g.items.find(i=>i.id===itemId);
  if(!it)return;
  if(target&&target.id===itemId){
    s.placed[itemId]=Date.now();
    toast('✓ Правильно: '+it.name,'ok');
    selId=null;save();drawSvg();drawTray();showInfo(it,g);checkDone(g);renderTabs();
  }else{
    s.wrong++;s.miss[itemId]=(s.miss[itemId]||0)+1;save();
    toast(target?'✗ Це «'+target.name+'»':'✗ Тут немає такої зони','bad');
    flash(target);
    drawStatus();
  }
}
function drawStatus(){const m=$('#main');const old=m.querySelector('.bar');const g=gameOf(cur);if(old&&old.parentNode===m){old.replaceWith(statusBar(g))}}
function flash(target){
  if(!target)return;
  const ns=document.querySelectorAll('#layer [data-id="'+target.id+'"]');
  ns.forEach(n=>n.classList.add('wrong'));
  setTimeout(()=>{ns.forEach(n=>n.classList.remove('wrong'))},900);
}
function tapAt(cx,cy){
  const g=gameOf(cur);
  const p=svgPt(cx,cy);if(!p)return;
  const h=hitArea(g,p[0],p[1]);
  if(!selId){
    const f=h.length?h[0][0]:null;
    if(f&&st(g.id).placed[f.id]!==undefined){showInfo(f,g);return}
    toast('Спочатку вибери назву внизу, потім торкнись карти');return;
  }
  placeOn(selId,h.length?h[0][0]:null);
}
function tapSlot(id){
  const g=gameOf(cur),it=g.items.find(i=>i.id===id);
  if(!selId){
    if(st(g.id).placed[id]!==undefined){showInfo(it,g);return}
    toast('Спочатку вибери назву внизу, потім торкнись кружечка');return}
  placeOn(selId,it);
}
function showInfo(it,g){
  const e=$('#info');if(!e)return;
  e.style.display='block';
  e.innerHTML='<b>'+it.name+'</b><br>'+it.info+(it.approx?'<div class="src">⚠ Позиція значка орієнтовна: на карті конспекту він без підпису.</div>':'')+'<div class="src">'+src(g)+'</div>';
}
function drawTray(){
  const g=gameOf(cur),s=st(g.id),t=$('#tray');if(!t)return;
  t.innerHTML='';
  const rest=items(g).filter(i=>s.placed[i.id]===undefined);
  if(!rest.length){t.innerHTML='<div class="hint">Усі назви розставлено ✓</div>';return}
  t.appendChild(el('div','hint','Назви ('+rest.length+'). Торкнись і потім – місце на карті, або перетягни:'));
  const w=el('div','chips');w.style.marginTop='6px';
  rest.forEach(i=>{
    const c=el('div','chip'+(selId===i.id?' sel':''),i.name);c.dataset.id=i.id;
    c.addEventListener('pointerdown',e=>chipDown(e,i.id,c));
    w.appendChild(c);
  });
  t.appendChild(w);
}
/* drag */
function chipDown(e,id,node){
  e.preventDefault();
  const sx=e.clientX,sy=e.clientY;let moved=false;
  const pid=e.pointerId;
  const mv=ev=>{
    if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){
      moved=true;drag={id,ghost:el('div','ghost',node.textContent)};document.body.appendChild(drag.ghost);
      selId=id;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
      $('#mapbox')&&$('#mapbox').classList.add('armed');
    }
    if(moved){drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px';nearHL(ev.clientX,ev.clientY)}
  };
  const up=ev=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    if(moved){
      const d=drag;drag=null;d.ghost.remove();clearNear();
      if(cur==='sort')dropSort(d.id,ev.clientX,ev.clientY);
      else{
        const g=gameOf(cur),p=svgPt(ev.clientX,ev.clientY);
        if(p){
          let tg=null;
          if(g.type==='area'){const h=hitArea(g,p[0],p[1]);tg=h.length?h[0][0]:null}
          else tg=nearestSlot(g,p[0],p[1]);
          placeOn(d.id,tg);
        }
      }
      selId=null;drawTray();const b=$('#mapbox');b&&b.classList.remove('armed');
    }else{
      selId=(selId===id)?null:id;
      document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c.dataset.id===selId));
      const b=$('#mapbox');b&&b.classList.toggle('armed',!!selId);
    }
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function clearNear(){document.querySelectorAll('.near').forEach(n=>n.classList.remove('near'))}
function nearHL(cx,cy){
  clearNear();
  if(cur==='sort'){const c=colAt(cx,cy);c&&c.classList.add('near');return}
  const g=gameOf(cur),p=svgPt(cx,cy);if(!p)return;
  if(g.type==='area'){const h=hitArea(g,p[0],p[1]);if(h.length){document.querySelectorAll('#layer [data-id="'+h[0][0].id+'"]').forEach(n=>n.classList.add('near'))}}
  else{const n=nearestSlot(g,p[0],p[1]);if(n){const x=document.querySelector('#layer [data-id="'+n.id+'"]');x&&x.classList.add('near')}}
}

/* ---------- finish ---------- */
function checkDone(g){
  const s=st(g.id),[n,t]=prog(g);
  if(n<t||s.done)return;
  s.done=true;
  const full=!s.only;
  const missed=Object.keys(s.miss).length;
  const acc=Math.round((t-missed)/t*100);
  s.hist.unshift({a:s.attempt,w:s.wrong,acc:acc,full:full});s.hist=s.hist.slice(0,8);
  if(full&&(s.best==null||s.wrong<s.best))s.best=s.wrong;
  save();renderTabs();
  setTimeout(()=>showFinal(g),600);
}
function showFinal(g){
  const s=st(g.id),all=(g.items),t=items(g).length;
  const missed=Object.keys(s.miss).map(id=>({it:all.find(i=>i.id===id),c:s.miss[id]})).filter(x=>x.it);
  const acc=Math.round((t-missed.length)/t*100);
  const h=s.hist[0]||{};
  let html='<div class="sub">'+(g.title)+' · спроба №'+s.attempt+(s.only?' (повтор помилкових)':'')+'</div>';
  html+='<div class="big">'+acc+'%</div><h2>'+(missed.length?'Без помилок з першого разу: '+(t-missed.length)+' з '+t:'Ідеально! Усе з першого разу 🎉')+'</h2>';
  html+='<div class="bar" style="margin:6px 0"><span class="pill r">помилкових дотиків: '+s.wrong+'</span>'+(s.best!=null?'<span class="pill">🏆 рекорд: '+s.best+'</span>':'')+'</div>';
  if(s.hist.length>1){html+='<div class="hint">Попередні спроби: '+s.hist.slice(1,6).map(x=>'№'+x.a+' – '+x.acc+'%').join(' · ')+'</div>'}
  if(missed.length){
    html+='<h3 style="margin:10px 0 2px;font-size:15px">Що повторити (із конспекту, '+g.page+'):</h3>';
    missed.sort((a,b)=>b.c-a.c).forEach(x=>{html+='<div class="mis"><b>'+x.it.name+'</b> <span class="hint">(помилок: '+x.c+')</span><br>'+x.it.info+'</div>'});
  }else html+='<div class="hint" style="margin-top:8px">Спробуй іншу гру або пройди цю ще раз для кращого рекорду.</div>';
  html+='<div class="bar" style="margin-top:10px">';
  if(missed.length)html+='<button class="btn p" id="fRep">🔁 Повторити помилкові</button>';
  html+='<button class="btn" id="fNew">Нова спроба</button><button class="btn" id="fClose">Закрити</button></div>';
  $('#sheet').innerHTML=html;$('#final').classList.add('on');
  $('#fClose').onclick=()=>$('#final').classList.remove('on');
  $('#fNew').onclick=()=>{const s2=st(g.id);const a=s2.attempt+1;resetGame(g,true);s2.attempt=a;save();$('#final').classList.remove('on');render()};
  const r=$('#fRep');if(r)r.onclick=()=>{const s2=st(g.id);const ids=Object.keys(s2.miss);const a=s2.attempt+1;resetGame(g,false);s2.only=ids;s2.attempt=a;save();$('#final').classList.remove('on');render()};
}

/* ---------- sort game ---------- */
function colAt(cx,cy){const e=document.elementFromPoint(cx,cy);return e?e.closest('.col'):null}
function renderSort(m,g){
  const s=st(g.id);
  const lv=el('div','lvl');
  D.sorts.forEach((x,i)=>{const b=el('button','btn'+(i===sortLvl?' on':''),(st(x.id).done?'★ ':'')+x.title);b.onclick=()=>{sortLvl=i;selId=null;render()};lv.appendChild(b)});
  m.appendChild(lv);
  m.appendChild(statusBar(g));
  const hc=el('div','card');hc.innerHTML='<b>'+g.title+'</b><div class="hint">Перетягни назву в потрібну колонку (або торкнись назви, потім колонки). '+src(g)+'</div>';m.appendChild(hc);
  const cols=el('div','cols');cols.style.setProperty('--n',g.cols.length);cols.id='cols';
  g.cols.forEach((c,ci)=>{
    const d=el('div','col');d.dataset.ci=ci;d.appendChild(el('h4','',c));
    items(g).filter(i=>s.placed[i.id]!==undefined).forEach(i=>{if(i.col===ci)d.appendChild(el('div','chip',i.name))});
    d.addEventListener('pointerup',e=>{if(drag)return;if(selId)dropSortCol(selId,ci)});
    cols.appendChild(d);
  });
  const w=el('div','card');w.appendChild(cols);m.appendChild(w);
  const tray=el('div','card');tray.id='tray';m.appendChild(tray);
  const info=el('div','card info');info.id='info';info.style.display='none';m.appendChild(info);
  drawTray();
}
function dropSort(id,cx,cy){const c=colAt(cx,cy);if(c)dropSortCol(id,+c.dataset.ci)}
function dropSortCol(id,ci){
  const g=gameOf('sort'),s=st(g.id),it=g.items.find(i=>i.id===id);
  if(it.col===ci){
    s.placed[id]=Date.now();selId=null;save();toast('✓ '+it.name+' → '+g.cols[ci],'ok');
    checkDone(g);render();showInfo(it,g);
  }else{
    s.wrong++;s.miss[id]=(s.miss[id]||0)+1;save();
    toast('✗ Ні, «'+it.name+'» не в «'+g.cols[ci]+'»','bad');drawStatus();
  }
}

/* ---------- fun ---------- */
function renderFun(m){
  const c=el('div','card fun');
  c.innerHTML='<b>✨ Цікаве</b><div class="hint">Торкнись картинки, щоб збільшити.</div>';
  const im=el('img');im.src='mnemo.jpg';im.alt='mnemo';
  im.addEventListener('error',()=>{im.replaceWith(el('div','hint','Картинку mnemo.jpg не знайдено. Поклади файл mnemo.jpg поруч із index.html (у тій самій папці на GitHub).'))});
  im.onclick=()=>im.classList.toggle('big');
  c.appendChild(im);m.appendChild(c);
}

let lastW=window.innerWidth;
window.addEventListener('resize',()=>{if(window.innerWidth===lastW)return;lastW=window.innerWidth;if(cur!=='fun'&&cur!=='sort')drawSvg()});
render();
</script>
